<!doctype html>
<html lang="en" data-theme="crucible">
  <head>
    <meta charset="UTF-8" /><script>try{var c=localStorage.getItem("crucible-color");if(c==="light"||c==="dark")document.documentElement.dataset.color=c}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live Crucible scenes: an airport ramp, an AI data center and a container port, built from real PBR models and rendered in the browser." />
    <link rel="canonical" href="https://crucible.codepawl.com/showcase.html" />
    <title>Showcase · Crucible</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" /><link rel="icon" href="/favicon.ico?v=2" sizes="48x48" /><link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="site showcase">
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="navigation">
      <a class="brand" href="/" aria-label="Crucible home">Crucible</a>
      <nav aria-label="Library">
        <a href="/docs.html">Docs</a><a href="/recipes.html">Recipes</a><a href="/marketplace.html">Marketplace</a><a href="/changelog.html">Changelog</a>
      </nav>
      <a class="site-nav-cta" href="https://github.com/codepawl/crucible" aria-label="GitHub"><span class="package-logo package-logo-github" aria-hidden="true"></span><span class="site-nav-cta-label">GitHub</span></a>
    </header>
    <main id="content">
      <section class="showcase-stage" aria-labelledby="showcase-title">
        <div class="showcase-head">
          <div>
            <h1 id="showcase-title">Showcase</h1>
            <p id="showcase-blurb"></p>
          </div>
          <div class="showcase-controls"><div id="showcase-tabs" class="showcase-tabs" role="group" aria-label="Scene"></div></div>
        </div>
        <div class="showcase-frame">
          <button id="showcase-reset" class="showcase-reset" type="button">Reset view</button>
          <canvas id="showcase-viewport" tabindex="0" aria-label="Live 3D scene. Drag to orbit, right-drag or shift-drag to pan, scroll to zoom, WASD or arrow keys to move, Q and E to turn."></canvas>
          <p id="showcase-status" role="status"></p>
        </div>
        <details class="showcase-credits">
          <summary>Models and licences</summary>
          <ul id="showcase-credits"></ul>
        </details>
      </section>
      <section class="showcase-cook" aria-labelledby="showcase-cook-title">
        <h2 id="showcase-cook-title">Path traced with Cook</h2>
        <div class="showcase-cook-grid">
          <figure>
            <img src="./previews/cook-pabellon.webp" alt="A glass pavilion with a travertine wall behind a shallow pool of pebbles, path traced by Cook" width="1600" height="900" loading="lazy" />
            <figcaption><strong>Barcelona Pavilion</strong>A glass pavilion and travertine wall over a pebble pool, path traced by Cook.<small>Model by eMirage, <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a>, from the <a href="https://www.blender.org/download/demo-files/">Blender demo files</a>.</small></figcaption>
          </figure>
          <figure>
            <img src="./previews/cook-monk.webp" alt="A monastery courtyard with a stone well, seen from a desk with an open book, path traced by Cook" width="1600" height="1200" loading="lazy" />
            <figcaption><strong>Lone Monk</strong>A cloister courtyard with a stone well, seen from a desk with an open book, path traced by Cook.<small>Model by Carlo Bergonzini / Monorender, from the <a href="https://www.blender.org/download/demo-files/">Blender demo files</a>.</small></figcaption>
          </figure>
          <figure>
            <img src="./previews/cook-monster.webp" alt="A hooded child in a bed swinging a club over a white monster, path traced by Cook" width="1200" height="1200" loading="lazy" />
            <figcaption><strong>Monster</strong>A hooded child on a bed above a white monster, path traced by Cook.<small>Model by Metin Seven, based on 2D concept art by Blake Stevenson, <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a>, from the <a href="https://www.blender.org/download/demo-files/">Blender demo files</a>.</small></figcaption>
          </figure>
        </div>
      </section>
      <section id="community" class="showcase-community" aria-labelledby="community-title">
        <h2 id="community-title">Made with Crucible</h2>
        <div id="community-grid" class="community-grid" hidden></div>
        <div class="community-submit">
          <a class="community-submit-primary" href="https://github.com/codepawl/crucible/discussions/new?category=show-and-tell"><span class="package-logo package-logo-github" aria-hidden="true"></span>Submit yours</a>
          <a id="community-email" href="mailto:hello@codepawl.com">or send it by email</a>
        </div>
      </section>
    </main>
    <footer class="site-footer" aria-label="Site footer">
      <p><a class="brand" href="/" aria-label="Crucible home">Crucible</a> by <a href="https://codepawl.com">CodePawl</a></p>
      <nav class="footer-links" aria-label="Project links"><a href="https://github.com/codepawl/crucible"><span class="package-logo package-logo-github" aria-hidden="true"></span>GitHub</a><a href="https://www.npmjs.com/package/@codepawlhq/crucible"><span class="package-logo package-logo-npm" aria-hidden="true"></span>npm</a><a href="/changelog.md">Changelog</a><a href="/license.txt">MIT license</a></nav>
    </footer>
    <script type="module" src="/src/showcase.js"></script>
  </body>
</html>
