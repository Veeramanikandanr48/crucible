<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1f23" />
    <meta name="description" content="Crucible web Studio for interactive picking, transform gizmos, lighting, materials and camera bookmarks on a shared agent recipe." />
    <title>Crucible · Studio</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #1b1f23;
        color: #edf0ef;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      .studio-shell {
        display: grid;
        grid-template-rows: auto 1fr;
        width: 100%;
        height: 100svh;
        min-height: 580px;
      }
      .studio-header {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 12px 20px;
        background: #161a1e;
      }
      .studio-header a.brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #f5f6f5;
        text-decoration: none;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.04em;
      }
      .studio-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-left: auto;
      }
      .studio-nav a {
        text-decoration: none;
        color: #a6b1b6;
        font-size: 13px;
        padding: 7px 11px;
        border-radius: 7px;
      }
      .studio-nav a[aria-current="page"] {
        color: #edf0ef;
        background: #ffffff12;
      }
      #studio-root {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 500px;
      }
    </style>
  </head>
  <body>
    <div class="studio-shell">
      <header class="studio-header">
        <a class="brand" href="./" aria-label="Crucible home">Crucible</a>
        <nav class="studio-nav" aria-label="Site"><a href="./studio.html" aria-current="page">Studio</a><a href="./docs.html">Docs</a><a href="./recipes.html">Recipes</a><a href="./showcase.html">Showcase</a><a href="./marketplace.html">Marketplace</a><a href="./changelog.html">Changelog</a></nav>
      </header>
      <main id="studio-root"></main>
    </div>
    <script type="module" src="/src/studio-page.js"></script>
  </body>
</html>
